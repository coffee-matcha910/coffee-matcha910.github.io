  .el { position: absolute; }

  .linked, .lnk { cursor: pointer; transition: opacity .25s; }

  .editing .lnk { text-decoration: underline dotted; text-underline-offset: 3px; cursor: text; }
  .editing .lnk:hover { opacity: 1; }
  .tx { outline: none; display: block; }
  .grip { position: absolute; left: -24px; top: 0; width: 18px; height: 18px; display: none; cursor: grab; background: #fff; border: 1px solid #e7c2b9; color: #c0533a;
          font: 12px/16px system-ui, sans-serif; text-align: center; user-select: none; letter-spacing: 0; }
  .editing .el:hover > .grip, .editing .el.sel > .grip { display: block; }
  .editing .el.has-grip { cursor: default; }
  .name-text { white-space: nowrap; line-height: 1; }
  .name-crayon svg, .deco svg { width: 100%; height: auto; overflow: visible; }
  .pic img { width: 100%; height: auto; }
  .icon { width: var(--icon-size); height: var(--icon-size); transition: opacity .25s, transform .25s; }
  .icon.linked:hover { opacity: .55; transform: translateY(-2px); }
  .icon svg { width: 100%; height: 100%; overflow: visible; }
  .icon .lbl { position: absolute; left: 50%; top: 100%; transform: translateX(-50%); margin-top: 2px; font-size: 11px; white-space: nowrap; opacity: 0; transition: opacity .2s; pointer-events: none; color: var(--ink); }
  .labels-on .icon:hover .lbl { opacity: .6; }
  .deco { pointer-events: none; }
  .el.hidden-el { display: none; }

  /* 반짝임 */
  .spark { transform-box: fill-box; transform-origin: center; animation: twinkle 1.8s ease-in-out infinite; }
  @keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(.3) rotate(0deg); } 45% { opacity: 1; transform: scale(1) rotate(20deg); } 70% { opacity: .5; transform: scale(.7) rotate(30deg); } }
  .glow { animation: glow 2.4s ease-in-out infinite; }
  @keyframes glow { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
  .wag { transform-box: view-box; transform-origin: 71px 47px; animation: wag .55s ease-in-out infinite alternate; }
  @keyframes wag { from { transform: rotate(-20deg); } to { transform: rotate(16deg); } }
  @media (prefers-reduced-motion: reduce) { .spark, .glow, .wag { animation: none; opacity: .9; } }

  /* 편집 중 */
  .editing .el { cursor: grab; }
  .editing .deco { pointer-events: auto; }
  .editing .el:hover { outline: 1px dashed rgba(0,0,0,.25); outline-offset: 5px; }
  .editing .el.sel { outline: 1px solid #c0533a; outline-offset: 5px; }
  .editing .el.dragging { cursor: grabbing; opacity: .7; }
  .editing .el.hidden-el { display: block; opacity: .15; }
  .editing [contenteditable] { cursor: text; }
  .rh { position: absolute; right: -9px; bottom: -9px; width: 14px; height: 14px; background: #fff; border: 1px solid #c0533a; cursor: nwse-resize; display: none; }
  .editing .el.sel .rh { display: block; }
  body.drag-now, body.drag-now * { user-select: none !important; }

  /* ---------------- 작업 페이지들 ---------------- */
  .page { max-width: 620px; margin: 0 auto; padding: 96px 28px 120px; min-height: 100vh; }
  .page.wide { max-width: 1040px; }
  .top { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 72px; }
  .top a:hover { opacity: .45; }
  .cats { list-style: none; }
  .cats li { border-bottom: 1px solid var(--line); }
  .cats li:first-child { border-top: 1px solid var(--line); }
  .cats a { display: flex; justify-content: space-between; align-items: baseline; padding: 22px 0; font-size: 20px; }
  .cats a span { font-size: 12px; opacity: .45; }
  .cats a:hover { opacity: .45; }
  .page-title { font-size: 24px; font-weight: 400; margin-bottom: 48px; }
  .year { font-size: 12px; opacity: .45; letter-spacing: .1em; margin: 40px 0 8px; }
  .item { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 12px 0; }
  .item .t { font-size: 17px; }
  .item .d { font-size: 12px; opacity: .45; white-space: nowrap; }
  .item .n { display: block; font-size: 12px; opacity: .45; margin-top: 2px; }
  .item:hover .t { opacity: .45; }
  .empty { font-size: 14px; opacity: .45; }
  article h1 { font-size: 26px; font-weight: 400; line-height: 1.4; }
  article .meta { font-size: 12px; opacity: .45; margin: 8px 0 56px; }
  .body { font-size: 17px; line-height: 2; }
  .body.poem { white-space: pre-wrap; line-height: 2.1; }
  .body.prose p { margin-bottom: 1.4em; text-indent: 1em; }
  .published { margin-top: 64px; font-size: 12px; opacity: .45; }
  .video { aspect-ratio: 16 / 9; width: 100%; background: #f3f2ef; margin-bottom: 40px; display: flex; align-items: center; justify-content: center; font-size: 12px; opacity: .7; }
  .video iframe { width: 100%; height: 100%; border: 0; }
  .ext { display: inline-block; font-size: 12px; opacity: .45; margin: -24px 0 40px; }

  /* 지난 프로필 */
  .arch-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 48px 32px; }
  .arch-card { display: block; cursor: pointer; }
  .thumb { position: relative; width: 100%; aspect-ratio: 16 / 10; overflow: hidden; border: 1px solid var(--line); }
  .thumb-inner { position: absolute; top: 0; left: 0; width: 1280px; height: 800px; transform-origin: 0 0; pointer-events: none; }

  .arch-card .cap span { opacity: .45; font-size: 12px; }
  .arch-card:hover .thumb { opacity: .8; }
  .arch-back { position: fixed; top: 20px; left: 24px; z-index: 50; font-size: 13px; background: var(--bg); padding: 2px 6px; }

  @media (max-width: 600px) { .page { padding: 56px 22px 80px; } .top { margin-bottom: 48px; } .body { font-size: 16px; } }

  #editor {

  #editor input[type=color] { width: 100%; height: 28px; border: 1px solid #ddd; background: #fff; padding: 2px; }
  #editor button, #editor .btn { display: block; text-align: center; width: 100%; margin-top: 8px; padding: 8px; border: 1px solid #111; background: #fff; color: #111; font: inherit; cursor: pointer; }
  #editor .row button, #editor .row .btn { margin-top: 0; }
  #editor .seg { display: flex; margin-top: 2px; }
  #editor .seg button { margin: 0; border-color: #ddd; color: #666; padding: 6px 0; }
  #editor .seg button + button { border-left: 0; }
  #editor .seg button.on { background: #111; color: #fff; border-color: #111; }
  #editor button.primary { background: #111; color: #fff; }
  #editor button.ghost { border-color: #ddd; color: #666; }
  #editor button.danger { border-color: #e7c2b9; color: #c0533a; }
  #editor .selbox { margin-top: 10px; padding: 10px; background: #faf8f4; border: 1px solid #eee; }
  #editor .selbox .name { font-weight: 600; }
  #editor .alist { margin-top: 6px; }

  #editor .alist button { width: auto; margin: 0; padding: 2px 6px; font-size: 11px; }
  #editor hr { border: 0; border-top: 1px solid #eee; margin: 16px 0 4px; }
  #editor textarea { width: 100%; height: 100px; margin-top: 8px; font: 11px/1.4 monospace; border: 1px solid #ddd; padding: 6px; }
  #editor .msg { margin-top: 8px; color: #c0533a; min-height: 1em; }
  #editor .close { position: absolute; top: 10px; right: 12px; width: auto; margin: 0; padding: 0 4px; border: 0; font-size: 16px; color: #999; }
  #editor .mode { display: inline-block; margin-top: 6px; padding: 2px 8px; background: #111; color: #fff; font-size: 11px; }
  #editor input[type=file] { display: none; }
  @media (max-width: 720px) { #editor { left: 8px; right: 8px; width: auto; top: auto; bottom: 8px; max-height: 50vh; } }

/* ---------- 상태 ---------- */
const LS_KEY = "rema-site-draft-v6";
const $app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const dev = () => innerWidth <= 720 ? "mobile" : "desktop";

let cfg = clone(CONFIG), editing = false, selected = null;

function applyVars() {
  const r = document.documentElement.style;

/* ---------- 프로필 그리기 (현재 프로필과 지난 프로필 공용) ---------- */
function renderCanvas(src, opt = {}) {
  const device = opt.device || dev(), ed = !!opt.editing, sel = opt.selected;
  const ce = ed ? ` contenteditable="plaintext-only" spellcheck="false"` : "";
  const grip = ed ? `<span class="grip" title="잡고 끌어서 옮기기">✥</span>` : "";
  const getPos = k => ((src.pos || {})[device] || {})[k] || ((src.pos || {}).desktop || {})[k] || [40, 40];
  const style = (k, extra = "") => { const [x, y] = getPos(k); return `left:${x}%;top:${y}%;z-index:${(src.z || {})[k] || 1};${extra}`; };
  const cls = (k, c) => `el ${c}${(src.hidden || []).includes(k) ? " hidden-el" : ""}${sel === k ? " sel" : ""}`;
  const imgW = im => device === "mobile" ? Math.min(im.w * 2, 86) : im.w;
  const media = Object.assign({}, CONFIG.media, cfg.media, src.media);
  const parts = [];
  if (src.nameMode === "crayon") {
    parts.push(`<div class="${cls("name", "name-crayon")}" data-k="name" style="${style("name", `width:${src.nameWidth}px;color:${src.nameColor}`)}" aria-label="${esc(src.name)}">${nameCrayonSVG()}<span class="rh"></span></div>`);
  } else {
    parts.push(`<h1 class="${cls("name", "name-text has-grip")}" data-k="name" style="${style("name", `font-family:${esc(ff(src.nameFont))};font-size:${src.nameSize}px;color:${src.nameColor};font-weight:400`)}">${grip}<span class="tx" data-field="name"${ce}>${esc(src.name)}</span></h1>`);
  }
  (src.texts || []).forEach(t => parts.push(`<div class="${cls(t.id, "tbox has-grip")}" data-k="${t.id}" style="${style(t.id,
    `font-family:${esc(ff(t.font))};font-size:${t.size}px;line-height:${t.lh};letter-spacing:${t.ls / 100}em;text-align:${t.align || "left"};color:${t.color}`)}">${grip}<div class="tx" data-tid="${t.id}"${ce}>${runsHTML(t)}</div></div>`));
  (src.images || []).forEach(im => parts.push(`<figure class="${cls(im.id, "pic")}" data-k="${im.id}" style="${style(im.id, `width:${imgW(im)}cqw`)}"><img src="${esc(media[im.mid] || im.src || "")}" alt="" draggable="false"><span class="rh"></span></figure>`));
  (src.decos || []).forEach(d => DECOS[d.kind] && parts.push(`<div class="${cls(d.id, "deco")}" data-k="${d.id}" style="${style(d.id, `width:${d.w}px`)}" aria-hidden="true">${DECOS[d.kind].svg()}<span class="rh"></span></div>`));
  for (const [k, ic] of Object.entries(ICONS)) {
    const to = (src.links || {})[k] || "";
    parts.push(`<a class="${cls(k, "icon" + (to ? " linked" : ""))}" data-k="${k}" data-to="${esc(to)}" style="${style(k, `color:${(src.colors || {})[k] || src.iconColor};--icon-size:${src.iconSize}px`)}" aria-label="${esc((src.labels || {})[k] || ic.ko)}">${ic.svg()}<span class="lbl">${esc((src.labels || {})[k] || "")}</span></a>`);
  }
  return `<section class="canvas ${opt.fixed ? "fixed" : "full"}${ed ? " editing" : ""}${src.showLabels ? " labels-on" : ""}" style="background:${src.bg}">${parts.join("")}</section>`;
}
function getRuns(t) { return t.runs || [{ text: t.text || "", link: t.link || "" }]; }
function runsHTML(t) { return getRuns(t).map(r => r.link ? `<span class="lnk" data-to="${esc(r.link)}">${esc(r.text)}</span>` : esc(r.text)).join(""); }
function readRuns(tx) {
  const out = [];
  const push = (text, link) => { if (!text) return; const last = out[out.length - 1]; if (last && last.link === link) last.text += text; else out.push({ text, link }); };
  const walk = (node, link) => node.childNodes.forEach(c => {
    if (c.nodeType === 3) push(c.nodeValue, link);
    else if (c.nodeName === "BR") push("\n", link);
    else if (c.nodeType === 1) { if (c.nodeName === "DIV" && out.length) push("\n", link); walk(c, c.classList.contains("lnk") ? (c.dataset.to || "") : link); }
  });
  walk(tx, "");
  if (out.length) out[out.length - 1].text = out[out.length - 1].text.replace(/\n$/, "");
  return out.filter(r => r.text);
}
function linkRange(t, start, end, link) {
  const chars = [];
  getRuns(t).forEach(r => { for (const ch of r.text.split("")) chars.push([ch, r.link]); });
  for (let i = Math.max(0, start); i < Math.min(end, chars.length); i++) chars[i][1] = link;
  const runs = [];
  chars.forEach(([c, l]) => { const last = runs[runs.length - 1]; if (last && last.link === l) last.text += c; else runs.push({ text: c, link: l }); });
  t.runs = runs; t.text = runs.map(r => r.text).join(""); delete t.link;
}
function bindLinks(root) {
  root.querySelectorAll(".lnk").forEach(el => el.addEventListener("click", e => {
    if (editing) return;
    e.preventDefault(); e.stopPropagation();
    if (el.dataset.to) location.hash = el.dataset.to;
  }));
  root.querySelectorAll(".linked").forEach(el => el.addEventListener("click", e => {
    if (editing) return;
    e.preventDefault();
    if (el.dataset.to) location.hash = el.dataset.to;
  }));
}

function profileView() {
  $app.innerHTML = renderCanvas(cfg, { editing, selected });
  const canvas = $app.querySelector(".canvas");
  bindLinks(canvas);
  if (!editing) return;
  canvas.querySelectorAll(".tx").forEach(tx => {
    tx.addEventListener("input", () => {
      if (tx.dataset.field === "name") cfg.name = tx.innerText.replace(/\n$/, "");
      else { const t = cfg.texts.find(t => t.id === tx.dataset.tid); if (t) { t.runs = readRuns(tx); t.text = t.runs.map(r => r.text).join(""); delete t.link; } }
      saveDraft();
    });
    tx.addEventListener("paste", e => { e.preventDefault(); document.execCommand("insertText", false, e.clipboardData.getData("text/plain")); });
  });
  canvas.querySelectorAll(".el").forEach(el => {
    const k = el.dataset.k;
    el.addEventListener("pointerdown", e => {
      if (e.target.classList.contains("rh")) return startResize(e, el, k);
      if (el.classList.contains("has-grip") && !e.target.classList.contains("grip")) { if (selected !== k) select(k); return; }
      startDrag(e, el, k, canvas);
    });
  });
}
function setPos(k, p) { (cfg.pos[dev()] ||= {})[k] = p.map(v => Number(v.toFixed(2))); }

function startDrag(e, el, k, canvas) {
  if (e.button !== 0) return;
  const sx = e.clientX, sy = e.clientY, rect = canvas.getBoundingClientRect();
  const start = [parseFloat(el.style.left), parseFloat(el.style.top)];
  let moved = false;
  e.preventDefault();
  const mv = ev => {
    const dx = ev.clientX - sx, dy = ev.clientY - sy;
    if (!moved && Math.hypot(dx, dy) < 5) return;
    if (!moved) { moved = true; el.classList.add("dragging"); document.body.classList.add("drag-now"); if (document.activeElement) document.activeElement.blur(); }
    ev.preventDefault(); const s = window.getSelection(); if (s) s.removeAllRanges();
    el.style.left = Math.max(-20, Math.min(99, start[0] + dx / rect.width * 100)).toFixed(2) + "%";
    el.style.top = Math.max(-20, Math.min(99, start[1] + dy / rect.height * 100)).toFixed(2) + "%";
  };
  const up = () => {
    window.removeEventListener("pointermove", mv); window.removeEventListener("pointerup", up);
    document.body.classList.remove("drag-now"); el.classList.remove("dragging");
    if (moved) { setPos(k, [parseFloat(el.style.left), parseFloat(el.style.top)]); saveDraft(); }
    select(k);
  };
  window.addEventListener("pointermove", mv); window.addEventListener("pointerup", up);
}
function startResize(e, el, k) {
  e.preventDefault(); e.stopPropagation();
  const sx = e.clientX, w0 = el.getBoundingClientRect().width;
  const im = cfg.images.find(i => i.id === k), d = cfg.decos.find(i => i.id === k);
  const mv = ev => {
    const w = Math.max(16, w0 + ev.clientX - sx);
    if (im) { const vw = w / innerWidth * 100; im.w = Number((dev() === "mobile" ? vw / 2 : vw).toFixed(2)); el.style.width = (dev() === "mobile" ? Math.min(im.w * 2, 86) : im.w) + "cqw"; }
    else if (d) { d.w = Math.round(w); el.style.width = w + "px"; }
    else if (k === "name") { cfg.nameWidth = Math.round(w); el.style.width = w + "px"; }
  };
  const up = () => { window.removeEventListener("pointermove", mv); window.removeEventListener("pointerup", up); saveDraft(); renderSelBox(); };
  window.addEventListener("pointermove", mv); window.addEventListener("pointerup", up);
}
let textSel = null;
document.addEventListener("selectionchange", () => {
  if (!editing) return;
  const s = window.getSelection();
  if (!s || !s.rangeCount) return;
  const r = s.getRangeAt(0), tx = (r.commonAncestorContainer.nodeType === 1 ? r.commonAncestorContainer : r.commonAncestorContainer.parentElement)?.closest(".tx[data-tid]");
  if (!tx) return;
  const pre = document.createRange(); pre.selectNodeContents(tx); pre.setEnd(r.startContainer, r.startOffset);
  const start = pre.toString().length, text = r.toString();
  textSel = text ? { tid: tx.dataset.tid, start, end: start + text.length, text } : null;
  renderSelLink();
});
function renderSelLink() {
  const box = document.getElementById("sellink"); if (!box) return;
  const t = cfg.texts.find(t => t.id === selected);
  if (!t) return;
  if (!textSel || textSel.tid !== t.id) { box.innerHTML = `<p class="hint">링크를 걸 글자를 마우스로 끌어서 선택해 주세요.</p>`; return; }
  box.innerHTML = `<p class="hint">선택한 글자: <b style="color:#111">“${esc(textSel.text.length > 24 ? textSel.text.slice(0, 24) + "…" : textSel.text)}”</b></p>
    ${linkSel("s-rlink", "")}<div class="row" style="margin-top:6px"><button id="s-rapply">이 글자에 링크 걸기</button><button class="ghost" id="s-rclear">링크 빼기</button></div>`;
  const sel = { ...textSel };
  const go = link => { linkRange(t, sel.start, sel.end, link); textSel = null; saveDraft(); profileView(); renderSelBox(); };
  box.querySelector("#s-rapply").onclick = () => { const v = box.querySelector("#s-rlink").value; if (v) go(v); };
  box.querySelector("#s-rclear").onclick = () => go("");
}
function select(k) {
  selected = k;
  document.querySelectorAll(".canvas .el").forEach(el => el.classList.toggle("sel", el.dataset.k === k));
  renderSelBox();
}

/* ---------- 작업 페이지 ---------- */
const topBar = (h, l) => `<div class="top"><a href="#home">${esc(cfg.name)}</a>${h ? `<a href="#${h}">← ${l}</a>` : ""}</div>`;

let lsWarned = false;

  try { localStorage.setItem(LS_KEY, JSON.stringify(cfg)); }
  catch (e) { if (!lsWarned) { lsWarned = true; msg("사진이 많아 임시 저장이 꽉 찼어요. 지금 ‘저장한 파일 받기’를 눌러 두세요."); } }
}
function loadDraft() { try { const d = JSON.parse(localStorage.getItem(LS_KEY)); if (d) cfg = { ...clone(CONFIG), ...d }; } catch (e) {} }
function clearDraft() { try { localStorage.removeItem(LS_KEY); } catch (e) {} }

function gcMedia() {
  const used = new Set(cfg.images.map(i => i.mid));
  cfg.archive.forEach(a => (a.snap.images || []).forEach(i => used.add(i.mid)));

}

      ${common}<button class="danger" id="s-del">이 글 상자 지우기</button>`;
  } else if (im) {
    h = `<div class="name">선택: 사진</div>${rangeH("s-iw", "크기", 3, 90, .5, im.w)}<p class="hint" style="margin-top:6px">오른쪽 아래 모서리를 끌어도 크기가 바뀌어요.</p>${common}<button class="danger" id="s-del">이 사진 지우기</button>`;
  } else if (d) {
    h = `<div class="name">선택: ${DECOS[d.kind].ko}</div>${rangeH("s-dw", "크기", 16, 600, 2, d.w)}<p class="hint" style="margin-top:6px">장식은 방문자가 눌러도 아무 일 없고, 아래 글자도 그대로 누를 수 있어요.</p>${common}<button class="danger" id="s-del">이 장식 지우기</button>`;
  } else if (ICONS[k]) {
    h = `<div class="name">선택: ${ICONS[k].ko}</div>
      <label>누르면 들어갈 곳</label>${linkSel("s-link", cfg.links[k])}
      <label>마우스를 올리면 보일 말</label><input type="text" id="s-lbl" value="${esc(cfg.labels[k] || "")}">
      <label>이 아이콘 색</label><input type="color" id="s-ic" value="${cfg.colors[k] || cfg.iconColor}">${common}`;
  }
  box.innerHTML = h;

  bind(box, "s-front", () => { bringFront(k); rerender(); }, "click");
  bind(box, "s-hide", () => { cfg.hidden = cfg.hidden.includes(k) ? cfg.hidden.filter(x => x !== k) : [...cfg.hidden, k]; rerender(); renderSelBox(); }, "click");
  bind(box, "s-mode", v => { cfg.nameMode = v; applyVars(); rerender(); renderSelBox(); }, "change");
  bind(box, "s-nw", v => { cfg.nameWidth = v; rerender(); });
  bind(box, "s-nf", v => { cfg.nameFont = v; applyVars(); rerender(); }, "change");
  bind(box, "s-ns", v => { cfg.nameSize = v; rerender(); });
  bind(box, "s-nc", v => { cfg.nameColor = v; rerender(); });
  if (t) {
    box.querySelectorAll("[data-al]").forEach(b => b.onclick = () => { t.align = b.dataset.al; saveDraft(); rerender(); renderSelBox(); });
    bind(box, "s-tf", v => { t.font = v; applyVars(); rerender(); }, "change");
    bind(box, "s-ts", v => { t.size = v; rerender(); });
    bind(box, "s-tl", v => { t.lh = v; rerender(); });
    bind(box, "s-tk", v => { t.ls = v; rerender(); });
    bind(box, "s-tc", v => { t.color = v; rerender(); });
    bind(box, "s-tlink", v => { linkRange(t, 0, getRuns(t).map(r => r.text).join("").length, v); rerender(); renderSelBox(); }, "change");
    renderSelLink();
    bind(box, "s-del", () => { cfg.texts = cfg.texts.filter(x => x !== t); selected = null; rerender(); renderSelBox(); }, "click");
  }
  if (im) {
    bind(box, "s-iw", v => { im.w = v; rerender(); });
    bind(box, "s-del", () => { cfg.images = cfg.images.filter(x => x !== im); gcMedia(); selected = null; rerender(); renderSelBox(); }, "click");
  }
  if (d) {
    bind(box, "s-dw", v => { d.w = v; rerender(); });
    bind(box, "s-del", () => { cfg.decos = cfg.decos.filter(x => x !== d); selected = null; rerender(); renderSelBox(); }, "click");
  }
  if (ICONS[k]) {
    bind(box, "s-link", v => { cfg.links[k] = v; rerender(); }, "change");
    bind(box, "s-lbl", v => { cfg.labels[k] = v; const s = document.querySelector(`.icon[data-k="${k}"] .lbl`); if (s) s.textContent = v; });
    bind(box, "s-ic", v => { cfg.colors[k] = v; rerender(); });
  }
}

function addImages(files) {
  [...files].forEach((f, i) => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, 1400 / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      let src = c.toDataURL("image/webp", 0.85);
      if (!src.startsWith("data:image/webp")) src = f.type === "image/png" ? c.toDataURL("image/png") : c.toDataURL("image/jpeg", 0.85);
      URL.revokeObjectURL(img.src);
      const id = uid("img"), mid = uid("m");
      cfg.media[mid] = src;
      cfg.images.push({ id, mid, w: 16 });
      setPos(id, [36 + i * 3, 20 + i * 3]); bringFront(id);
      selected = id; saveDraft(); profileView(); renderSelBox();
    };
    img.src = URL.createObjectURL(f);
  });
}
function addDeco(kind) {
  const id = uid("d"), w = { garland: 260, wreath: 120, tree: 46, gift: 40 }[kind];
  cfg.decos.push({ id, kind, w }); setPos(id, [44, 40]); bringFront(id);
  selected = id; saveDraft(); profileView(); renderSelBox();
}
function renderArchiveList() {
  const box = document.getElementById("alist"); if (!box) return;
  box.innerHTML = cfg.archive.length ? [...cfg.archive].reverse().map(a => `<div><span>${esc(a.title || "제목 없음")} · ${esc(a.date)}</span>
    <button class="ghost" data-restore="${a.id}">불러오기</button><button class="danger" data-del="${a.id}">지우기</button></div>`).join("")
    : `<span class="hint">아직 보관한 프로필이 없어요.</span>`;
  box.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { cfg.archive = cfg.archive.filter(a => a.id !== b.dataset.del); gcMedia(); saveDraft(); renderArchiveList(); });
  box.querySelectorAll("[data-restore]").forEach(b => b.onclick = () => {
    const a = cfg.archive.find(a => a.id === b.dataset.restore); if (!a) return;
    const keep = { archive: cfg.archive, media: cfg.media, pageFont: cfg.pageFont };
    cfg = { ...clone(CONFIG), ...clone(a.snap), ...keep };
    selected = null; saveDraft(); applyVars(); profileView(); openEditor(); msg("그 프로필을 지금 프로필로 불러왔어요.");
  });
}

function openEditor() {
  let box = document.getElementById("editor");
  if (!box) { box = document.createElement("div"); box.id = "editor"; document.body.appendChild(box); }
  loadFonts(ALL_FONTS);
  box.innerHTML = `
    <button class="close" title="닫기">×</button>
    <h3>편집 모드</h3>
    <p class="hint">끌어서 옮기고, 글자는 눌러서 고쳐요. 방문자에게는 이 창이 보이지 않아요.</p>
    <span class="mode">${dev() === "mobile" ? "휴대폰 화면 배치 편집 중" : "컴퓨터 화면 배치 편집 중"}</span>

    <div class="row" style="margin-top:12px">
      <button id="add-text">+ 글 상자</button>
      <label class="btn" for="add-img" style="margin:0">+ 사진</label>
    </div>
    <input type="file" id="add-img" accept="image/*" multiple>
    <label>+ 장식</label>
    <div class="row"><button class="ghost" data-deco="garland">가랜드</button><button class="ghost" data-deco="tree">소나무</button><button class="ghost" data-deco="gift">선물</button></div>
    <div class="selbox" id="selbox"></div>

    <h4>지난 프로필로 보관하기</h4>
    <p class="hint">지금 프로필을 그대로 찍어서 ‘지난 프로필’ 전시실에 걸어 둬요.</p>
    <input type="text" id="arch-title" placeholder="예: 2026 겨울" style="margin-top:6px">
    <button id="arch-save">지금 프로필 보관하기</button>
    <div class="alist" id="alist"></div>

    <h4>전체</h4>
    ${rangeH("g-is", "아이콘 크기", 16, 120, 1, cfg.iconSize)}
    <label>아이콘 색 (한꺼번에)</label><input type="color" id="g-ic" value="${cfg.iconColor}">
    <label class="chk"><input type="checkbox" id="g-lbl" ${cfg.showLabels ? "checked" : ""}> 아이콘에 마우스를 올리면 말 보이기</label>
    <label>작업 페이지 서체</label>${fontSelect("g-pf", cfg.pageFont)}
    <div class="row"><div><label>기본 글자색</label><input type="color" id="g-ink" value="${cfg.ink}"></div><div><label>배경색</label><input type="color" id="g-bg" value="${cfg.bg}"></div></div>
    <p class="hint" style="margin-top:6px">* 표시 서체는 미리보기에선 비슷한 서체로 보이고, 실제 사이트에 올리면 제대로 보여요.</p>

    <hr>
    <button class="primary" id="save">저장한 파일 받기</button>
    <p class="hint" style="margin-top:6px">받은 index.html로 기존 파일을 바꿔 끼우면 적용돼요. (내 컴퓨터에서 파일을 열었을 때 작동)</p>
    <button id="copy">설정만 복사하기</button>
    <button class="ghost" id="relayout">이 화면 배치만 처음으로</button>
    <button class="ghost" id="reset">전부 처음 상태로</button>
    <div class="msg" id="msg"></div>
    <textarea id="out" hidden readonly></textarea>`;

  box.querySelector(".close").onclick = () => { location.hash = "home"; };
  box.querySelector("#add-text").onclick = () => {
    const id = uid("t");
    cfg.texts.push({ id, text: "새 글", runs: [{ text: "새 글", link: "" }], font: cfg.texts[0]?.font || "Gowun Batang", size: 14, lh: 1.8, ls: 0, align: "left", color: cfg.ink });
    setPos(id, [40, 40]); bringFront(id); selected = id; saveDraft(); profileView(); renderSelBox();
  };
  box.querySelector("#add-img").onchange = e => { addImages(e.target.files); e.target.value = ""; };
  box.querySelectorAll("[data-deco]").forEach(b => b.onclick = () => addDeco(b.dataset.deco));
  box.querySelector("#arch-save").onclick = () => {
    const snap = clone(cfg); delete snap.archive; delete snap.media;
    const d = new Date(), date = `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, "0")}.${String(d.getDate()).padStart(2, "0")}`;
    cfg.archive.push({ id: uid("arch"), title: box.querySelector("#arch-title").value.trim(), date, snap });
    box.querySelector("#arch-title").value = ""; saveDraft(); renderArchiveList(); msg("지금 프로필을 보관했어요. 저장한 파일을 받아야 사이트에도 걸려요.");
  };
  bind(box, "g-is", v => { cfg.iconSize = v; profileView(); });
  bind(box, "g-ic", v => { cfg.iconColor = v; cfg.colors = {}; profileView(); });
  bind(box, "g-lbl", v => { cfg.showLabels = v; profileView(); }, "change");
  bind(box, "g-pf", v => { cfg.pageFont = v; applyVars(); }, "change");
  bind(box, "g-ink", v => { cfg.ink = v; applyVars(); });
  bind(box, "g-bg", v => { cfg.bg = v; applyVars(); profileView(); });

  const configText = () => { gcMedia(); return "/*" + "CONFIG-START" + "*/\nconst CONFIG = " + JSON.stringify(cfg, null, 2) + ";\n/*" + "CONFIG-END" + "*/"; };
  box.querySelector("#save").onclick = () => {
    try {
      const re = new RegExp("\\/\\*" + "CONFIG-START" + "\\*\\/[\\s\\S]*?\\/\\*" + "CONFIG-END" + "\\*\\/");
      const html = ORIGINAL.replace(re, () => configText());
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([html], { type: "text/html" }));
      a.download = "index.html"; document.body.appendChild(a); a.click(); a.remove();
      msg("index.html을 받았어요. 기존 파일과 바꿔 주세요.");
    } catch (e) { msg("여기서는 파일 받기가 막혀 있어요. ‘설정만 복사하기’를 써 주세요."); }
  };
  box.querySelector("#copy").onclick = async () => {
    const out = box.querySelector("#out"); out.value = configText(); out.hidden = false; out.select();
    try { await navigator.clipboard.writeText(out.value); msg("복사했어요."); } catch (e) { msg("아래 내용을 직접 복사해 주세요."); }
  };
  box.querySelector("#relayout").onclick = () => { cfg.pos[dev()] = clone(CONFIG.pos[dev()] || {}); saveDraft(); profileView(); msg("이 화면의 배치를 처음으로 돌렸어요."); };
  box.querySelector("#reset").onclick = () => { cfg = clone(CONFIG); clearDraft(); selected = null; applyVars(); profileView(); openEditor(); msg("처음 상태로 되돌렸어요."); };
  renderSelBox(); renderArchiveList();
}
function closeEditor() { const b = document.getElementById("editor"); if (b) b.remove(); }

/* ---------- 라우팅 ---------- */
function route() {
  const h = location.hash.slice(1) || "home";
  const was = editing;
  editing = h === "edit";
  if (editing && !was) { loadDraft(); applyVars(); }
  if (!editing && was) { closeEditor(); selected = null; cfg = clone(CONFIG); applyVars(); }
  const cat = CATS.find(c => c.hash === h), work = WORKS.find(w => w.id === h), arch = cfg.archive.find(a => a.id === h);
  if (h === "work") catsView();
  else if (h === "archive") archiveView();
  else if (arch) archiveItemView(arch);
  else if (cat) listView(cat);
  else if (work) workView(work);
  else profileView();
  if (editing && !document.getElementById("editor")) openEditor();
  if (!editing) window.scrollTo(0, 0);
}
let lastDev = dev();
window.addEventListener("resize", () => {
  const h = location.hash.slice(1);
  if (h === "archive") { $app.querySelectorAll(".thumb").forEach(t => { t.firstElementChild.style.transform = `scale(${t.clientWidth / 1280})`; }); return; }
  if (dev() !== lastDev) { lastDev = dev(); if (!h || h === "home" || h === "edit" || h.startsWith("arch-")) { route(); } }
});
window.addEventListener("hashchange", route);
applyVars();
route();
</script></body></html>
